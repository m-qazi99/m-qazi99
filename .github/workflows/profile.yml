name: Profile showcase checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_showcase.py
      - run: python -c "from pathlib import Path; import xml.etree.ElementTree as E; [E.parse(p) for p in Path('assets/visual').glob('review-*.svg')]"
      - run: git diff --exit-code
